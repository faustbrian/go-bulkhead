schema_version: 1
tool_version: v1.8.5
tool_checksums_sha256: 57f81a14b32fa629f9ed5c9cc6edc62c171095f5da6e36fa989dc12442fe1983
manifest:
  modules: modules.json
  packages: packages.json
evidence:
  root: ".verification"
mutation:
  root: ".verification/mutation"
  imports:
  - module: "."
    archive: ".verification/mutation/bootstrap/root.zip"
    ledger: ".verification/mutation/migration-ledger.json"
api:
  baselines:
  - module: "."
    mode: apidiff
    path: api/baseline.txt
operations:
- module: "."
  gate: docs
  steps:
  - type: make
    makefile: Makefile
    target: docs
    timeout: 20m
- module: "."
  gate: fuzz
  steps:
  - type: go-test
    packages: ["."]
    fuzz: '^FuzzConfigurationNeverPanics$'
    budget: 100x
    timeout: 2m
  - type: go-test
    packages: ["."]
    fuzz: '^FuzzPermitHistoriesConserveCapacity$'
    budget: 100x
    timeout: 2m
- module: "."
  gate: benchmark
  steps:
  - type: go-test
    packages: ["./..."]
    benchmark: "."
    budget: 100ms
    timeout: 20m
