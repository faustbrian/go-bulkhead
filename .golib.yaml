schema_version: 1
tool_version: v1.0.3
tool_checksums_sha256: a53eacea92f126ba3a871ab9a4cc0986512d1b7df03ba8cec8e7866d0db87112
manifest:
  modules: modules.json
  packages: packages.json
evidence:
  root: ".verification"
mutation:
  root: ".verification/mutation"
  imports:
  - module: "."
    archive: ".verification/mutation/bootstrap/root.zip"
    ledger: ".verification/mutation/migration-ledger.json"
api:
  baselines:
  - module: "."
    mode: apidiff
    path: api/baseline.txt
operations:
- module: "."
  gate: fuzz
  steps:
  - type: go-test
    packages: ["."]
    fuzz: '^FuzzConfigurationNeverPanics$'
    budget: 100x
    timeout: 2m
  - type: go-test
    packages: ["."]
    fuzz: '^FuzzPermitHistoriesConserveCapacity$'
    budget: 100x
    timeout: 2m
- module: "."
  gate: benchmark
  steps:
  - type: go-test
    packages: ["./..."]
    benchmark: "."
    budget: 100ms
    timeout: 20m
