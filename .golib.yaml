schema_version: 1
tool_version: v2.5.1
tool_checksums_sha256: ca1293ba633e3ebb5197134cd586979db4e0af51a37e0de0bad2884005327c15
manifest:
  modules: modules.json
  packages: packages.json
evidence:
  root: ".verification"
mutation:
  root: ".verification/mutation"
  imports:
  - module: "."
    archive: ".verification/mutation/bootstrap/root.zip"
    ledger: ".verification/mutation/migration-ledger.json"
api:
  baselines:
  - module: "."
    mode: apidiff
    path: api/baseline.txt
operations:
- module: "."
  gate: local-test
  steps:
  - type: go-test
    packages: ["."]
    run: '^Test(AdmissionAndCloseRaceLinearizesWithoutCapacityLeak|CancellationAndReleaseRaceHasOneTerminalAdmission|ConcurrentDuplicateReleaseChangesCapacityOnce|CloseRejectsWaitersAndDrainHonorsCallerBound)$'
    race: true
    count: 1
    timeout: 2m
- module: "."
  gate: docs
  steps:
  - type: make
    makefile: Makefile
    target: docs
    timeout: 20m
- module: "."
  gate: fuzz
  steps:
  - type: go-test
    packages: ["."]
    fuzz: '^FuzzConfigurationNeverPanics$'
    budget: 100x
    timeout: 2m
  - type: go-test
    packages: ["."]
    fuzz: '^FuzzPermitHistoriesConserveCapacity$'
    budget: 100x
    timeout: 2m
- module: "."
  gate: benchmark
  steps:
  - type: go-test
    packages: ["./..."]
    benchmark: "."
    budget: 100ms
    timeout: 20m
